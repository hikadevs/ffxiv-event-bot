[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffxiv-event-bot"
version = "0.1.0"
description = "A Discord bot for FFXIV character profiles, event signups, and raid scheduling."
requires-python = ">=3.11"

dependencies = [
    "discord.py",
    "python-dotenv",
    "aiohttp",
    "beautifulsoup4",
    "asyncpg",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[project.scripts]
xivbot = "xivbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
